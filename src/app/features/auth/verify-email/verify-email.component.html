<div class="auth-container">
  <div class="auth-card verify-card">

    <!-- ── Loading ── -->
    <div *ngIf="status === 'loading'"
         style="display:flex; flex-direction:column; align-items:center; gap:12px;">
      <div class="spinner"></div>
      <p style="color:#888; font-size:14px;">Verifying your email...</p>
    </div>

    <!-- ── Success ── -->
    <div *ngIf="status === 'success'"
         style="display:flex; flex-direction:column; align-items:center; gap:10px;">

      <div style="font-size:64px;">✅</div>

      <h2 style="font-size:22px; font-weight:700; color:#fff; margin:0;">
        Email Verified!
      </h2>

      <p style="font-size:14px; color:#888; margin:0;">
        {{ message }}
      </p>

      <p style="font-size:13px; color:#555; margin:0;">
        Redirecting to login...
      </p>

      <a routerLink="/login"
         style="
           display: inline-block;
           margin-top: 8px;
           background: #00a884;
           color: #fff;
           border-radius: 24px;
           padding: 12px 32px;
           font-size: 15px;
           font-weight: 600;
           text-decoration: none;
           box-shadow: 0 4px 16px rgba(0,168,132,0.3);
         ">
        Go to login
      </a>
    </div>

    <!-- ── Error ── -->
    <div *ngIf="status === 'error'"
         style="display:flex; flex-direction:column; align-items:center; gap:10px;">

      <div style="font-size:64px;">❌</div>

      <h2 style="font-size:22px; font-weight:700; color:#ff6b6b; margin:0;">
        Verification Failed
      </h2>

      <p style="font-size:14px; color:#888; margin:0; text-align:center;">
        {{ message }}
      </p>

      <!-- ── Resend form ── -->
      <div *ngIf="!resendSuccess"
           style="display:flex; flex-direction:column; align-items:center;
                  gap:10px; width:100%; margin-top:8px;">

        <p style="font-size:13px; color:#555; margin:0;">
          Link expired? Enter your email to get a new one.
        </p>

        <input
          type="email"
          [(ngModel)]="resendEmail"
          placeholder="your@email.com"
          style="
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            background: #1a1a1a;
            color: #fff;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
          "
        />

        <button
          (click)="resendVerification()"
          [disabled]="resendLoading || !resendEmail"
          style="
            background: #00a884;
            color: #fff;
            border: none;
            border-radius: 24px;
            padding: 11px 28px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 16px rgba(0,168,132,0.3);
            opacity: 1;
            transition: opacity 0.2s;
          "
          [style.opacity]="resendLoading || !resendEmail ? '0.5' : '1'"
        >
          {{ resendLoading ? 'Sending...' : '📧 Resend Verification Email' }}
        </button>

      </div>

      <!-- ── Resend success ── -->
      <div *ngIf="resendSuccess"
           style="display:flex; flex-direction:column; align-items:center;
                  gap:8px; margin-top:8px;">
        <div style="font-size:48px;">📬</div>
        <p style="color:#00a884; font-size:15px; font-weight:600; margin:0;">
          Verification email sent!
        </p>
        <p style="color:#555; font-size:13px; margin:0;">
          Check your inbox and click the new link.
        </p>
      </div>

      <!-- Divider -->
      <div style="width:100%; height:1px; background:#1a1a1a; margin:8px 0;"></div>

      <a routerLink="/register"
         style="
           color: #555;
           font-size: 13px;
           text-decoration: underline;
           cursor: pointer;
         ">
        Register with a different email
      </a>

    </div>

  </div>
</div>
