<div class="auth-container">
  <div class="auth-card" *ngIf="!success">
    <!-- Brand -->
    <div class="brand">
      <div class="brand-icon">💬</div>
      <span class="brand-name">ChatApp</span>
    </div>

    <h2 class="auth-title">Create account</h2>
    <p class="auth-subtitle">Join ChatApp and start messaging</p>

    <!-- Avatar Upload -->
    <div class="avatar-upload">
      <label class="avatar-circle">
        <img
          *ngIf="imagePreview"
          [src]="imagePreview"
          style="
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
          "
        />
        <span *ngIf="!imagePreview" style="font-size: 28px">📷</span>
        <input
          type="file"
          accept="image/*"
          (change)="onImageSelected($event)"
          hidden
        />
      </label>
      <span class="avatar-label">Upload photo (optional)</span>
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Full name</label>
        <input
          type="text"
          [(ngModel)]="form.name"
          name="name"
          placeholder="Your full name"
          required
        />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input
          type="email"
          [(ngModel)]="form.email"
          name="email"
          placeholder="your@email.com"
          required
        />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Phone</label>
          <input
            type="text"
            [(ngModel)]="form.phonenumber"
            name="phonenumber"
            placeholder="+1234567890"
            required
          />
        </div>
        <div class="form-group">
          <label>Location</label>
          <input
            type="text"
            [(ngModel)]="form.location"
            name="location"
            placeholder="City, Country"
            required
          />
        </div>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input
          type="password"
          [(ngModel)]="form.password"
          name="password"
          placeholder="Min 6 characters"
          required
        />
      </div>

      <p class="error" *ngIf="error">{{ error }}</p>

      <button type="submit" [disabled]="loading">
        {{ loading ? "Creating account..." : "Create account" }}
      </button>
    </form>

    <p class="switch-link">
      Already have an account? <a routerLink="/login">Sign in</a>
    </p>
  </div>

  <!-- Success -->
  <div class="auth-card verify-card" *ngIf="success">
    <div style="font-size: 64px; margin-bottom: 8px">📧</div>

    <h2 style="font-size: 22px; font-weight: 700; color: #fff; margin: 0 0 8px">
      Check your email!
    </h2>

    <p style="font-size: 14px; color: #888; margin: 0">
      We sent a verification link to
    </p>

    <p
      style="font-size: 15px; font-weight: 600; color: #00a884; margin: 6px 0 0"
    >
      {{ form.email }}
    </p>

    <p style="font-size: 13px; color: #555; margin: 10px 0 20px">
      Link expires in 24 hours.
    </p>

    <a
      routerLink="/login"
      style="
        display: inline-block;
        background: #00a884;
        color: #fff;
        border: none;
        border-radius: 24px;
        padding: 12px 32px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        box-shadow: 0 4px 16px rgba(0, 168, 132, 0.3);
        transition: background 0.2s;
      "
    >
      Go to login
    </a>
  </div>
</div>
