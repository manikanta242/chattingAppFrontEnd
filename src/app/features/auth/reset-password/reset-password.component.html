<div class="auth-container">
  <div class="auth-card">
    <h2>Reset Password 🔐</h2>

    <div *ngIf="!success">
      <div class="form-group">
        <label>New Password</label>
        <input type="password" [(ngModel)]="newPassword"
               placeholder="Enter new password" />
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" [(ngModel)]="confirmPassword"
               placeholder="Confirm new password" />
      </div>

      <p class="error"   *ngIf="error">{{ error }}</p>

      <button class="btn-primary" (click)="onSubmit()" [disabled]="loading || !token">
        {{ loading ? 'Resetting...' : 'Reset Password' }}
      </button>
    </div>

    <!-- Success -->
    <div *ngIf="success" style="text-align:center;">
      <div style="font-size:60px;">✅</div>
      <h3 style="color:#27ae60; margin:12px 0;">Password Reset!</h3>
      <p>{{ success }}</p>
      <p style="color:#888;">Redirecting to login...</p>
    </div>
  </div>
</div>
