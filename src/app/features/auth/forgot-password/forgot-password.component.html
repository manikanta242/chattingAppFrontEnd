<div class="auth-container">
  <div class="auth-card" *ngIf="!success">
    <h2>Forgot Password 🔐</h2>
    <p style="color: #888; margin-bottom: 16px; font-size: 0.9rem">
      Enter your email and we'll send you a reset link.
    </p>

    <div class="form-group">
      <label>Email</label>
      <input type="email" [(ngModel)]="email" placeholder="your@email.com" />
    </div>

    <p class="error" *ngIf="error">{{ error }}</p>

    <button class="btn-primary" (click)="onSubmit()" [disabled]="loading">
      {{ loading ? "Sending..." : "Send Reset Link" }}
    </button>

    <p class="switch-link">
      Remember your password? <a routerLink="/login">Login</a>
    </p>
  </div>

  <!-- Success -->
  <div class="auth-card verify-card" *ngIf="success">
    <div style="font-size: 64px; margin-bottom: 8px">📧</div>

    <h2 style="font-size: 22px; font-weight: 700; color: #fff; margin: 0 0 8px">
      Check your email!
    </h2>

    <p style="font-size: 14px; color: #888; margin: 0">
      We sent a password reset link to
    </p>

    <p
      style="font-size: 15px; font-weight: 600; color: #00a884; margin: 6px 0 0"
    >
      {{ email }}
    </p>

    <p style="font-size: 13px; color: #555; margin: 10px 0 20px">
      Link expires in 1 hour.
    </p>

    <a
      routerLink="/login"
      style="
        display: inline-block;
        background: #00a884;
        color: #fff;
        border-radius: 24px;
        padding: 12px 32px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        box-shadow: 0 4px 16px rgba(0, 168, 132, 0.3);
      "
    >
      Back to login
    </a>
  </div>
</div>
