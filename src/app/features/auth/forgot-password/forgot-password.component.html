<div class="auth-container">
  <div class="auth-card" *ngIf="!success">
    <h2>Forgot Password 🔐</h2>
    <p style="color:#888; margin-bottom:16px; font-size:0.9rem;">
      Enter your email and we'll send you a reset link.
    </p>

    <div class="form-group">
      <label>Email</label>
      <input type="email" [(ngModel)]="email"
             placeholder="your@email.com" />
    </div>

    <p class="error" *ngIf="error">{{ error }}</p>

    <button class="btn-primary" (click)="onSubmit()" [disabled]="loading">
      {{ loading ? 'Sending...' : 'Send Reset Link' }}
    </button>

    <p class="switch-link">
      Remember your password? <a routerLink="/login">Login</a>
    </p>
  </div>

  <!-- Success -->
  <div class="auth-card" *ngIf="success" style="text-align:center;">
    <div style="font-size:60px;">📧</div>
    <h2>Check Your Email!</h2>
    <p>We sent a reset link to <strong>{{ email }}</strong></p>
    <p style="color:#888; font-size:0.85rem; margin-top:8px;">
      Link expires in 1 hour.
    </p>
    <a routerLink="/login" class="btn-primary"
       style="display:inline-block; margin-top:16px;">
      Back to Login
    </a>
  </div>
</div>
