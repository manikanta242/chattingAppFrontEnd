<div class="agent-layout">

  <app-sidebar activeRoute="agent"></app-sidebar>

  <!-- ── MAIN PANEL ── -->
  <div class="agent-panel">

    <!-- Header -->
    <div class="agent-header">
      <span class="agent-title">🤖 AI Assistant <span class="model-badge">Llama 3.3 · Groq</span></span>
      <button class="clear-btn" (click)="clearChat()" title="Clear chat">🗑 Clear</button>
    </div>

    <!-- Messages -->
    <div class="messages-area">
      <div class="empty-state" *ngIf="messages.length === 0">
        <div class="empty-icon">🤖</div>
        <p>Ask me anything!</p>
      </div>

      <div
        *ngFor="let msg of messages"
        class="message-bubble"
        [class.user]="msg.role === 'user'"
        [class.assistant]="msg.role === 'assistant'"
      >
        <div class="bubble-label">{{ msg.role === 'user' ? 'You' : 'AI' }}</div>
        <div class="bubble-text">{{ msg.content || '▋' }}</div>
      </div>
    </div>

    <!-- Input -->
    <div class="input-area">
      <textarea
        [(ngModel)]="userInput"
        (keydown.enter)="$event.preventDefault(); send()"
        placeholder="Ask me anything..."
        rows="1"
        [disabled]="isStreaming"
      ></textarea>
      <button (click)="send()" [disabled]="!userInput.trim() || isStreaming">
        {{ isStreaming ? '...' : 'Send' }}
      </button>
    </div>

  </div>
</div>
